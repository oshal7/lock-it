name: Build signed APK

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch: {}

# Never run two release builds for the same ref at once — versionCode comes from run_number, and
# overlapping runs racing to sign/upload could get confusing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compute version
        id: version
        run: |
          BASE_VERSION=$(cat VERSION | tr -d '[:space:]')
          # versionCode MUST increase on every single build we ever ship, forever, or Android
          # will refuse to install the new APK as an update over the old one and force an
          # uninstall — wiping local app data. github.run_number is monotonically increasing
          # across every workflow run in this repo's history, so it's a safe, zero-maintenance
          # source for it.
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="${BASE_VERSION}+${VERSION_CODE}"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building VoiceLock ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Require a stable release keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            echo "::error::VoiceLock must be signed with the SAME keystore on every single build,"
            echo "::error::forever — that's what lets a new APK install as an update over the"
            echo "::error::old one instead of demanding an uninstall (which would wipe local app"
            echo "::error::data, including your recorded trigger phrase and passcode)."
            echo "::error::Generate one keystore ONCE and store it as a secret — see README.md."
            exit 1
          fi

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.keystore"
          cat > "${{ github.workspace }}/keystore.properties" <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PVERSION_CODE="${{ steps.version.outputs.code }}" \
            -PVERSION_NAME="${{ steps.version.outputs.name }}" \
            -PPICOVOICE_ACCESS_KEY="${{ secrets.PICOVOICE_ACCESS_KEY }}" \
            --no-daemon --stacktrace

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore" "${{ github.workspace }}/keystore.properties"

      - name: Rename APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          NAME="VoiceLock-${{ steps.version.outputs.name }}.apk"
          mkdir -p dist
          cp "$SRC" "dist/${NAME}"
          echo "path=dist/${NAME}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
